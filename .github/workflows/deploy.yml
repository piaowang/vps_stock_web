name: Deploy StockWatch to VPS

on:
  push:
    branches:
      - main
    paths:
      - "stockwatch/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: stockwatch-deploy
  cancel-in-progress: true

env:
  REMOTE_APP_DIR: /opt/stockwatch
  NGINX_STATIC_DIR: /usr/local/nginx/html/stockwatch
  NGINX_BIN: /usr/local/nginx/sbin/nginx
  SSH_PORT: ${{ secrets.PORT || '22' }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Backend Syntax
        working-directory: stockwatch/backend
        run: |
          npm ci
          npm run check

      - name: Prepare Remote Directories
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ env.SSH_PORT }}
          script: |
            set -e
            rm -rf "${{ env.REMOTE_APP_DIR }}"
            mkdir -p "${{ env.REMOTE_APP_DIR }}" "${{ env.NGINX_STATIC_DIR }}"
            rm -rf "${{ env.NGINX_STATIC_DIR }}"/*

      - name: Upload StockWatch Project
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ env.SSH_PORT }}
          source: "stockwatch/*"
          target: ${{ env.REMOTE_APP_DIR }}
          strip_components: 1

      - name: Restart Backend and Reload Nginx
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ env.SSH_PORT }}
          script: |
            set -e
            cd "${{ env.REMOTE_APP_DIR }}"
            test -f docker-compose.yml
            docker compose up -d --build aggregator

            cp -r frontend/* "${{ env.NGINX_STATIC_DIR }}"/

            test -f "${{ env.NGINX_STATIC_DIR }}/js/home.js"
            grep -q "quote-card__hint" "${{ env.NGINX_STATIC_DIR }}/js/home.js"
            test -f "${{ env.NGINX_STATIC_DIR }}/market/detail.html"

            "${{ env.NGINX_BIN }}" -t
            "${{ env.NGINX_BIN }}" -s reload

            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:8090/health >/dev/null; then
                docker image prune -f
                exit 0
              fi
              echo "Waiting for stockwatch-aggregator health check ($i/20)..."
              docker ps --filter "name=stockwatch-aggregator"
              docker logs --tail 40 stockwatch-aggregator || true
              sleep 3
            done

            echo "stockwatch-aggregator did not become healthy"
            docker ps --filter "name=stockwatch-aggregator"
            docker logs --tail 120 stockwatch-aggregator || true
            exit 1
