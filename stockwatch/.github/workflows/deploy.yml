name: Deploy StockWatch

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: stockwatch-deploy
  cancel-in-progress: true

env:
  REMOTE_APP_DIR: ${{ vars.REMOTE_APP_DIR || '/opt/stockwatch' }}
  NGINX_STATIC_DIR: ${{ vars.NGINX_STATIC_DIR || '/usr/local/nginx/html/stockwatch' }}
  NGINX_BIN: ${{ vars.NGINX_BIN || '/usr/local/nginx/sbin/nginx' }}
  SSH_PORT: ${{ secrets.SSH_PORT || '22' }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate backend syntax
        working-directory: backend
        run: |
          npm ci
          npm run check

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload project
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "mkdir -p '$REMOTE_APP_DIR' && rm -rf '$REMOTE_APP_DIR/backend' '$REMOTE_APP_DIR/frontend' '$REMOTE_APP_DIR/deploy' '$REMOTE_APP_DIR/docker-compose.yml'"

          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='backend/node_modules' \
            --exclude='*.log' \
            -czf - backend frontend deploy docker-compose.yml \
          | ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "tar -xzf - -C '$REMOTE_APP_DIR'"

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" << EOF
          set -e
          cd "$REMOTE_APP_DIR"
          docker compose up -d --build aggregator

          mkdir -p "$NGINX_STATIC_DIR"
          rm -rf "$NGINX_STATIC_DIR"/*
          cp -r frontend/* "$NGINX_STATIC_DIR"/

          "$NGINX_BIN" -t
          "$NGINX_BIN" -s reload

          curl -fsS http://127.0.0.1:8090/health >/dev/null
          EOF
