# StockWatch — 纯静态 Nginx 配置（无后端反代）
# 静态根目录与需求文档一致

server {
    listen 80;
    server_name your-domain.com;   # 仅用 IP 可改为 _

    root /usr/local/nginx/html/stockwatch;
    index index.html;

    charset utf-8;

    access_log /var/log/nginx/stockwatch.access.log;
    error_log  /var/log/nginx/stockwatch.error.log;

    location /css/ {
        try_files $uri =404;
        expires 7d;
    }

    location /js/ {
        try_files $uri =404;
        expires 7d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 部署:
#   1. 拷贝 frontend/ 下所有文件到 root 目录
#   2. cp deploy/nginx-stockwatch.conf /etc/nginx/conf.d/stockwatch.conf
#   3. nginx -t && nginx -s reload
#
# Windows 本机示例 root:
#   root D:/source_code/html/vps/stockwatch/frontend;
