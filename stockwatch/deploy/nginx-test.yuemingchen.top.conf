# 合并示例：test.yuemingchen.top
# - /           → StockWatch 静态站
# - /rayws      → 原有 WS 反代 8388（不变）
# - /healthcheck → 原有探活（不变）
#
# 静态文件目录（按你服务器实际路径改）:
#   /usr/local/nginx/html/stockwatch/

server {
    listen      443 ssl;
    listen [::]:443 ssl;

    server_name test.yuemingchen.top;

    ssl_certificate       /root/cert/fullchain.cer;
    ssl_certificate_key   /root/cert/yuemingchen.top.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;

    include /usr/local/nginx/conf/cf_ip_allow.conf;

    # ---------- StockWatch 静态站 ----------
    # GitHub Actions 会把 frontend/ 同步到这个 root 目录
    root /usr/local/nginx/html/stockwatch;
    index index.html;

    # 静态资源：找不到就 404，绝不能 fallback 成 index.html（否则 JS 会整页挂掉）
    location /css/ {
        try_files $uri =404;
        expires 7d;
    }

    location /js/ {
        try_files $uri =404;
        expires 7d;
    }

    location /market/ {
        try_files $uri $uri/ =404;
        expires 7d;
    }

    location = /index.html {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 以下保持你原来的配置 ----------
    location /rayws {
        proxy_redirect off;
        proxy_pass http://127.0.0.1:8388;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1200;
    }

    location /healthcheck {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}

