<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockWatch · 美股实时监控</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="navbar">
    <div class="navbar__brand">
      <span class="navbar__logo">◆</span>
      <h1>StockWatch</h1>
    </div>
    <div class="navbar__status">
      <span id="connectionStatus" class="status-badge status-badge--demo">连接中…</span>
      <span id="lastRefresh" class="refresh-time">—</span>
    </div>
  </header>

  <nav class="top-nav">
    <a href="/" class="active">首页</a>
    <a href="/market">市场总览</a>
    <a href="/stocks">股票列表</a>
    <a href="/news">财经新闻</a>
    <a href="/about">关于页面</a>
  </nav>

  <div id="bootError" class="boot-error" hidden></div>
  <main class="container">
    <section class="section">
      <h2 class="section__title">主要指数</h2>
      <div id="indexGrid" class="card-grid card-grid--indices"></div>
    </section>
    <section class="section">
      <h2 class="section__title">个股行情</h2>
      <div id="stockGrid" class="card-grid"></div>
    </section>
  </main>

  <div id="chartModal" class="modal" aria-hidden="true">
    <div class="modal__backdrop" data-close></div>
    <div class="modal__panel" role="dialog" aria-labelledby="modalTitle">
      <header class="modal__header">
        <div>
          <h3 id="modalTitle">—</h3>
          <p id="modalSubtitle" class="modal__subtitle"></p>
        </div>
        <button type="button" class="modal__close" data-close aria-label="关闭">×</button>
      </header>
      <div class="modal__body"><canvas id="priceChart"></canvas></div>
    </div>
  </div>

  <script src="/js/chart.min.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
