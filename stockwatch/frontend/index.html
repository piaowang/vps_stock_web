<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockWatch · 全球市场总览</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/market.css?v=7">
</head>
<body class="market-page">
  <header class="navbar">
    <div class="navbar__brand">
      <span class="navbar__logo">◆</span>
      <h1>StockWatch</h1>
    </div>
    <div class="navbar__status">
      <span id="marketLive" class="status-badge">全球市场</span>
      <span id="marketUpdated" class="refresh-time">加载中…</span>
    </div>
  </header>

  <nav class="top-nav">
    <a href="/" class="active">总览</a>
    <a href="/stocks">股票列表</a>
    <a href="/news">财经新闻</a>
    <a href="/about">关于</a>
  </nav>

  <main class="container">
    <div class="market-hero">
      <div>
        <h1>全球市场总览</h1>
        <p class="refresh-time">中 · 日 · 韩 · 美 主要指数实时快照</p>
      </div>
      <div class="market-hero__meta">
        <span class="live-badge">LIVE</span>
      </div>
    </div>

    <div class="market-stats">
      <div class="stat-pill"><div class="stat-pill__label">上涨</div><div id="statUp" class="stat-pill__value up">--</div></div>
      <div class="stat-pill"><div class="stat-pill__label">下跌</div><div id="statDown" class="stat-pill__value down">--</div></div>
      <div class="stat-pill"><div class="stat-pill__label">平盘</div><div id="statFlat" class="stat-pill__value flat">--</div></div>
    </div>

    <div id="regionMarkets"></div>

    <div id="etfSection"></div>

    <div id="marketError" class="market-error" hidden></div>

    <div class="insight-grid">
      <section class="insight-card">
        <div class="insight-card__label">全球市场情绪</div>
        <div id="sentimentValue" class="insight-card__value flat">计算中</div>
        <ul class="insight-card__list">
          <li id="sentimentLine1">汇总主要指数变化。</li>
          <li id="sentimentLine2">数据来自后端聚合接口。</li>
          <li id="sentimentLine3">仅供观察，不构成投资建议。</li>
        </ul>
      </section>
      <section class="insight-card">
        <div class="insight-card__label">区域涨跌</div>
        <div id="breadthValue" class="insight-card__value">--</div>
        <ul class="insight-card__list">
          <li id="breadthLine1">中国：上证与恒生。</li>
          <li id="breadthLine2">日本：日经 225。</li>
          <li id="breadthLine3">韩国：KOSPI 综合。</li>
        </ul>
      </section>
      <section class="insight-card">
        <div class="insight-card__label">美国风格参考</div>
        <div id="activityValue" class="insight-card__value">--</div>
        <ul class="insight-card__list">
          <li id="activityLine1">SPY 观察宽基。</li>
          <li id="activityLine2">QQQ 观察科技。</li>
          <li id="activityLine3">DIA 观察蓝筹。</li>
        </ul>
      </section>
    </div>
  </main>

  <script src="/js/overview.js?v=7"></script>
</body>
</html>
