<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockWatch - 股票列表</title>
  <style>
    body { margin: 0; font-family: "Segoe UI", sans-serif; background: #0f172a; color: #e2e8f0; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 1.25rem; }
    .nav { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.2rem; }
    .nav a { color: #93c5fd; text-decoration: none; }
    .active { color: #22d3ee !important; font-weight: 700; }
    table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 12px; overflow: hidden; }
    th, td { padding: 0.8rem; border-bottom: 1px solid #334155; text-align: left; }
    th { color: #94a3b8; font-weight: 600; font-size: 0.85rem; }
    .up { color: #16c784; } .down { color: #ea3943; } .flat { color: #94a3b8; }
    .muted { color: #94a3b8; font-size: 0.9rem; margin-bottom: 0.8rem; }
    .chips { display: flex; gap: 0.5rem; flex-wrap: wrap; margin: 0.7rem 0 1rem; }
    .chip { background: #1e293b; border: 1px solid #334155; border-radius: 999px; padding: 0.3rem 0.7rem; font-size: 0.82rem; color: #cbd5e1; }
  </style>
</head>
<body>
  <div class="wrap">
    <nav class="nav">
      <a href="/">总览</a>
      <a href="/stocks" class="active">股票列表</a>
      <a href="/news">财经新闻</a>
      <a href="/about">关于</a>
    </nav>
    <h1>股票列表</h1>
    <p id="stockUpdated" class="muted">正在加载真实行情...</p>
    <div id="stockChips" class="chips"></div>
    <table>
      <thead>
        <tr><th>代码</th><th>名称</th><th>价格</th><th>涨跌幅</th><th>昨收</th><th>备注</th></tr>
      </thead>
      <tbody id="stockBody">
        <tr><td colspan="6" class="muted">加载中...</td></tr>
      </tbody>
    </table>
  </div>
  <script src="/stocks/stocks.js"></script>
</body>
</html>
